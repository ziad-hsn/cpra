name: Release verification
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  go:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ['1.25.x', '1.27.x']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - run: make check
      - run: make verify-local
      - run: python3 -m unittest discover -s scripts/benchmark -p "test_*.py"
      - run: python3 -m unittest discover -s scripts/verification -p "test_*.py"
      - run: make test-all-drivers
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
        if: matrix.go == '1.27.x'
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 -tags='redis postgres mysql mongo rabbitmq kafka kubernetes aws systemd teams twilio' ./...
        if: matrix.go == '1.27.x'
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.22.0
      - run: make dashboard-build dashboard-check
      - run: pnpm --dir dashboard audit
