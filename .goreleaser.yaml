# JSON is a YAML subset. Build-only: release.py packages exact tested outputs.
{
  "version": 2,
  "project_name": "cpra",
  "dist": "dist/goreleaser",
  "builds": [
    {
      "id": "cpra",
      "main": ".",
      "binary": "cpra",
      "env": [
        "GOENV=off",
        "GOWORK=off",
        "GOTOOLCHAIN=local",
        "CGO_ENABLED=0",
        "GOAMD64=v1",
        "GOARM64=v8.0",
        "GOEXPERIMENT=",
        "GOFLAGS=",
        "GOPROXY=https://proxy.golang.org",
        "GOSUMDB=sum.golang.org",
        "GOPRIVATE=",
        "GONOPROXY=",
        "GONOSUMDB="
      ],
      "goos": [
        "linux",
        "darwin",
        "windows"
      ],
      "goarch": [
        "amd64",
        "arm64"
      ],
      "goamd64": [
        "v1"
      ],
      "goarm64": [
        "v8.0"
      ],
      "tags": [
        "redis",
        "postgres",
        "mysql",
        "mongo",
        "rabbitmq",
        "kafka",
        "kubernetes",
        "aws",
        "systemd",
        "teams",
        "twilio"
      ],
      "flags": [
        "-trimpath",
        "-mod=readonly",
        "-pgo=off",
        "-buildvcs=false",
        "-p=2"
      ],
      "ldflags": [
        "-X github.com/ziad-hsn/cpra/internal/version.Version={{ .Env.CPRA_VERSION }} -X github.com/ziad-hsn/cpra/internal/version.Commit={{ .Env.CPRA_COMMIT }} -X github.com/ziad-hsn/cpra/internal/version.Date={{ .Env.CPRA_DATE }}"
      ],
      "mod_timestamp": "{{ .Env.SOURCE_DATE_EPOCH }}"
    },
    {
      "id": "cpractl",
      "main": "./cmd/cpractl",
      "binary": "cpractl",
      "env": [
        "GOENV=off",
        "GOWORK=off",
        "GOTOOLCHAIN=local",
        "CGO_ENABLED=0",
        "GOAMD64=v1",
        "GOARM64=v8.0",
        "GOEXPERIMENT=",
        "GOFLAGS=",
        "GOPROXY=https://proxy.golang.org",
        "GOSUMDB=sum.golang.org",
        "GOPRIVATE=",
        "GONOPROXY=",
        "GONOSUMDB="
      ],
      "goos": [
        "linux",
        "darwin",
        "windows"
      ],
      "goarch": [
        "amd64",
        "arm64"
      ],
      "goamd64": [
        "v1"
      ],
      "goarm64": [
        "v8.0"
      ],
      "tags": [
        "redis",
        "postgres",
        "mysql",
        "mongo",
        "rabbitmq",
        "kafka",
        "kubernetes",
        "aws",
        "systemd",
        "teams",
        "twilio"
      ],
      "flags": [
        "-trimpath",
        "-mod=readonly",
        "-pgo=off",
        "-buildvcs=false",
        "-p=2"
      ],
      "ldflags": [
        "-X github.com/ziad-hsn/cpra/internal/version.Version={{ .Env.CPRA_VERSION }} -X github.com/ziad-hsn/cpra/internal/version.Commit={{ .Env.CPRA_COMMIT }} -X github.com/ziad-hsn/cpra/internal/version.Date={{ .Env.CPRA_DATE }}"
      ],
      "mod_timestamp": "{{ .Env.SOURCE_DATE_EPOCH }}"
    }
  ],
  "snapshot": {
    "version_template": "{{ .Env.CPRA_VERSION }}"
  },
  "release": {
    "disable": true
  }
}
