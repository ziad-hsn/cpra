site_name: CPRa Documentation
site_url: https://ziad-hsn.github.io/cpra/
site_description: Check services, follow incidents and configure recovery with the CPRa server, dashboard and CLI.
site_author: Ziad Hassan
repo_url: https://github.com/ziad-hsn/cpra
repo_name: ziad-hsn/cpra
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: ../.site-build
copyright: Copyright &copy; 2025–2026 Ziad Hassan · MIT license
theme:
  name: material
  custom_dir: overrides
  font: false
  logo: images/cpra-mark-color.svg
  favicon: favicon.ico
  features:
  - navigation.tabs
  - navigation.sections
  - navigation.top
  - navigation.footer
  - search.suggest
  - search.highlight
  - content.code.copy
  - content.action.edit
  palette:
  - media: (prefers-color-scheme)
    primary: custom
    accent: custom
    toggle:
      icon: material/brightness-auto
      name: Switch to light mode
  - media: '(prefers-color-scheme: light)'
    scheme: default
    primary: custom
    accent: custom
    toggle:
      icon: material/brightness-7
      name: Switch to dark mode
  - media: '(prefers-color-scheme: dark)'
    scheme: slate
    primary: custom
    accent: custom
    toggle:
      icon: material/brightness-4
      name: Switch to system preference
