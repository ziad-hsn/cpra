{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "cpra.fullname" . }}
  labels:
    {{- include "cpra.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "cpra.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress: {{ .Values.networkPolicy.ingress | toJson }}
  egress: {{ .Values.networkPolicy.egress | toJson }}
{{- end }}
