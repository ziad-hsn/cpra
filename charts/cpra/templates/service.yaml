{{- if .Values.api.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cpra.fullname" . }}
  labels:
    {{- include "cpra.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
  selector:
    {{- include "cpra.selectorLabels" . | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cpra.fullname" . }}-headless
  labels:
    {{- include "cpra.labels" . | nindent 4 }}
spec:
  clusterIP: None
  ports:
    - name: http
      port: 8060
      targetPort: http
  selector:
    {{- include "cpra.selectorLabels" . | nindent 4 }}
{{- end }}
