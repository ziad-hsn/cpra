apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "cpra.fullname" . }}
  labels:
    {{- include "cpra.labels" . | nindent 4 }}
spec:
  replicas: {{ ternary 0 1 .Values.maintenance }}
  serviceName: {{ include "cpra.fullname" . }}-headless
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      {{- include "cpra.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cpra.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/runtime: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        cpra.io/manifest-revision: {{ .Values.manifest.revision | quote }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "cpra.serviceAccount" . }}
      automountServiceAccountToken: {{ .Values.kubernetesRecovery.enabled }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
        {{- if .Values.icmp.enabled }}
        sysctls:
          - name: net.ipv4.ping_group_range
            value: "1001 1001"
        {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.management.enabled }}
      initContainers:
        {{- include "cpra.managementInit" . | nindent 8 }}
      {{- end }}
      containers:
        - name: cpra
          image: {{ include "cpra.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [/usr/local/bin/cpra]
          args:
            - -yaml
            - {{ printf "/etc/cpra/monitors/%s" (ternary .Values.manifest.file "monitors.yaml" (not (empty .Values.manifest.existingClaim))) | quote }}
            - -runtime-config
            - /etc/cpra/runtime/runtime.yaml
            {{- if .Values.api.enabled }}
            - -web.addr=0.0.0.0:8060
            - {{ printf "-web.auth-file=%s" (include "cpra.readTokenPath" .) | quote }}
            {{- else }}
            - -web=false
            {{- end }}
            {{- if .Values.allowEmpty }}
            - -allow-empty
            {{- end }}
          env:
            - name: GOMEMLIMIT
              value: {{ .Values.go.memoryLimit | quote }}
            {{- range .Values.providerEnv }}
            - name: {{ .name }}
              valueFrom:
                secretKeyRef:
                  name: {{ .secret }}
                  key: {{ .key }}
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          {{- if .Values.api.enabled }}
          ports:
            - name: {{ include "cpra.apiScheme" . }}
              containerPort: 8060
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if .Values.api.enabled }}
          {{- range $name := list "startup" "readiness" "liveness" }}
          {{ $name }}Probe:
            exec:
              command:
                - /usr/local/bin/cpractl
                - {{ ternary "ready" "health" (eq $name "readiness") }}
                - --server
                - {{ printf "%s://127.0.0.1:8060" (include "cpra.apiScheme" $) }}
                {{- if $.Values.management.enabled }}
                - --ca-file
                - /etc/cpra/management/ca.crt
                {{- else }}
                - --allow-insecure-http
                {{- end }}
                - --token-file
                - {{ include "cpra.readTokenPath" $ }}
                - --request-timeout
                - 2s
            {{- toYaml (index $.Values.probes $name) | nindent 12 }}
          {{- end }}
          {{- end }}
          volumeMounts:
            {{- if .Values.management.enabled }}
            - name: management-bootstrap
              mountPath: /etc/cpra/management
              subPath: protected
              readOnly: true
            {{- end }}
            {{- if .Values.providerFiles.existingSecret }}
            - name: provider
              mountPath: /etc/cpra/provider
              readOnly: true
            {{- end }}
            - name: state
              mountPath: /var/lib/cpra
            - name: runtime
              mountPath: /etc/cpra/runtime
              readOnly: true
            - name: monitors
              mountPath: /etc/cpra/monitors
              readOnly: true
            {{- if and .Values.api.enabled (not .Values.management.enabled) }}
            - name: auth
              mountPath: /run/secrets/cpra
              readOnly: true
            {{- end }}
            - name: tmp
              mountPath: /tmp
      volumes:
        {{- if .Values.management.enabled }}
        {{- include "cpra.managementVolumes" . | nindent 8 }}
        {{- end }}
        {{- if .Values.providerFiles.existingSecret }}
        - name: provider
          secret:
            secretName: {{ .Values.providerFiles.existingSecret }}
            defaultMode: 0440
        {{- end }}
        - name: runtime
          configMap:
            name: {{ include "cpra.fullname" . }}-runtime
        {{- if and .Values.api.enabled (not .Values.management.enabled) }}
        - name: auth
          secret:
            secretName: {{ .Values.auth.existingSecret }}
            defaultMode: 0440
            items:
              - key: {{ .Values.auth.key }}
                path: token
        {{- end }}
        - name: monitors
          {{- if .Values.manifest.existingSecret }}
          secret:
            secretName: {{ .Values.manifest.existingSecret }}
            defaultMode: 0440
            items:
              - key: {{ .Values.manifest.key }}
                path: monitors.yaml
          {{- else if .Values.manifest.existingConfigMap }}
          configMap:
            name: {{ .Values.manifest.existingConfigMap }}
            items:
              - key: {{ .Values.manifest.key }}
                path: monitors.yaml
          {{- else }}
          persistentVolumeClaim:
            claimName: {{ .Values.manifest.existingClaim }}
            readOnly: true
          {{- end }}
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        {{- if not .Values.persistence.enabled }}
        - name: state
          emptyDir:
            sizeLimit: 64Mi
        {{- else if .Values.persistence.existingClaim }}
        - name: state
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim }}
        {{- end }}
  {{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) }}
  volumeClaimTemplates:
    - metadata:
        name: state
        labels:
          {{- include "cpra.labels" . | nindent 10 }}
      spec:
        accessModes: [{{ .Values.persistence.accessMode }}]
        {{- if ne .Values.persistence.storageClass nil }}
        storageClassName: {{ .Values.persistence.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
  {{- end }}
