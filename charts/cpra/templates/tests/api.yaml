{{- if and .Values.api.enabled .Values.test.enabled (not .Values.maintenance) }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "cpra.fullname" . }}-test-api
  labels:
    {{- include "cpra.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  activeDeadlineSeconds: 60
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cpra-test
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: api
          image: {{ include "cpra.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [/usr/local/bin/cpractl]
          args:
            - ready
            - --server
            {{- if .Values.management.enabled }}
            - {{ printf "https://%s.%s.svc:%v" (include "cpra.fullname" .) .Release.Namespace .Values.service.port | quote }}
            - --ca-file
            - /run/secrets/cpra-ca/ca.crt
            {{- else }}
            - {{ printf "http://%s:%v" (include "cpra.fullname" .) .Values.service.port | quote }}
            - --allow-insecure-http
            {{- end }}
            - --token-file
            - /run/secrets/cpra/token
            - --token-root=/run/secrets/cpra
            - --token-reader-group=1001
            - --request-timeout
            - 10s
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 64Mi}
          volumeMounts:
            {{- if .Values.management.enabled }}
            - name: ca
              mountPath: /run/secrets/cpra-ca
              readOnly: true
            {{- end }}
            - name: auth
              mountPath: /run/secrets/cpra
              readOnly: true
      volumes:
        {{- if .Values.management.enabled }}
        - name: ca
          secret:
            secretName: {{ .Values.management.tls.existingSecret }}
            defaultMode: 0440
            items:
              - key: {{ .Values.management.tls.keys.ca }}
                path: ca.crt
        {{- end }}
        - name: auth
          secret:
            secretName: {{ .Values.auth.existingSecret }}
            defaultMode: 0440
            items:
              - key: {{ .Values.auth.key }}
                path: token
{{- end }}
