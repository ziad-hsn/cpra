# Runtime settings are separate from the existing monitor manifest.
storage:
  mode: raft
  directory: ./cpra-data
  batch_delay: 5ms
  batch_size: 1000
  snapshot_interval: 5m
  snapshot_retain: 3
  # A2A file manifests require an initialized wrapping backend in Raft mode.
  # Use one source here or under management.encryption, never both.
  # Keep keys outside the data directory and retain previous keys for old records.
  # encryption:
  #   backend: local
  #   local:
  #     active_key_file: /etc/cpra/private/wrapping.key
history:
  retention_days: 30
slo:
  queue_target: 250ms
  result_target: 5s
  window: 5m
  control_window: 30s
  evaluation_interval: 5s
  minimum_samples: 1000
  healthy_hold: 60s

# Manual requests still consume the monitor's ordinary recovery attempt budget.
manual_recovery:
  minimum_interval: 60s
  per_hour: 3
