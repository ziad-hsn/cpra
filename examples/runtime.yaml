# Runtime settings are separate from the existing monitor manifest.
storage:
  mode: raft
  directory: ./cpra-data
  batch_delay: 5ms
  batch_size: 1000
  snapshot_interval: 5m
  snapshot_retain: 3
  # A2A file manifests require an initialized wrapping backend in Raft mode.
  # Use one source here or under management.encryption, never both.
  # Keep keys outside the data directory and retain previous keys for old records.
  # encryption:
  #   backend: local
  #   local:
  #     active_key_file: /etc/cpra/private/wrapping.key
history:
  retention_days: 30
slo:
  queue_target: 250ms
  result_target: 5s
  window: 5m
  control_window: 30s
  evaluation_interval: 5s
  minimum_samples: 1000
  healthy_hold: 60s

# Manual requests still consume the monitor's ordinary recovery attempt budget.
manual_recovery:
  minimum_interval: 60s
  per_hour: 3

# File notification names are relative to this separate, private output root.
# Prefer cpractl local init to generate the platform-specific path.
# Examples using a log endpoint require this setting. The path must be absolute
# and separate from state, manifests, runtime configuration and key directories.
# Static validation checks these boundaries; startup verifies native ownership.
# notifications:
#   log_directory: /var/log/cpra/notifications
#   concurrency:
#     webhook: 4 # Independent sequences; supported range is 1–16.
#     email: 1   # Other drivers default to one per destination.
#   pacing:
#     webhook:
#       minimum_interval: 1s
#       shared_scope: operations-account # Add a quota shared by these endpoints.
# Shared pacing and provider scopes can reduce effective concurrency. This
# example's webhook interval serializes that shared scope; omit it when no
# documented account quota requires it. Discord and Opsgenie provider scopes
# remain serial; Slack enforces at least one second between requests. Pacing
# never authorizes replay of an uncertain action.
