# Actual servers. Run one profile at a time with a unique project name.
# These are disposable fixture credentials, never production credentials.
services:
  redis:
    profiles: [redis]
    image: redis:7.4
    ports: ["127.0.0.1:16379:6379"]
    command: ["redis-server", "--requirepass", "cpra-disposable", "--save", ""]
  postgres:
    profiles: [postgres]
    image: postgres:17
    ports: ["127.0.0.1:15432:5432"]
    environment:
      POSTGRES_USER: cpra
      POSTGRES_PASSWORD: cpra-disposable
      POSTGRES_DB: cpra
    command: ["postgres", "-c", "log_connections=on", "-c", "log_disconnections=on"]
  mysql:
    profiles: [mysql]
    image: mysql:8.4
    ports: ["127.0.0.1:13306:3306"]
    environment:
      MYSQL_ROOT_PASSWORD: cpra-disposable
      MYSQL_USER: cpra
      MYSQL_PASSWORD: cpra-disposable
      MYSQL_DATABASE: cpra
    command: ["--general-log=ON", "--log-output=TABLE"]
  mongo:
    profiles: [mongo]
    image: mongo:8.0
    ports: ["127.0.0.1:17017:27017"]
    command: ["mongod", "--bind_ip_all", "--setParameter", "logComponentVerbosity={command: {verbosity: 2}}"]
  rabbitmq:
    profiles: [rabbitmq]
    image: rabbitmq:4.1-management
    ports: ["127.0.0.1:15672:5672", "127.0.0.1:15673:15672"]
    environment:
      RABBITMQ_DEFAULT_USER: cpra
      RABBITMQ_DEFAULT_PASS: cpra-disposable
  kafka:
    profiles: [kafka]
    image: apache/kafka:3.9.1
    ports: ["127.0.0.1:19092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:19092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
