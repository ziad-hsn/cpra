# Apply only to the explicitly chosen test context. No cluster-scoped resources.
apiVersion: v1
kind: Namespace
metadata:
  name: cpra-verification
  labels: {cpra.verification: disposable}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cpra-verification
  namespace: cpra-verification
spec:
  replicas: 1
  selector:
    matchLabels: {app: cpra-verification}
  template:
    metadata:
      labels: {app: cpra-verification}
    spec:
      containers:
        - name: target
          image: registry.k8s.io/pause:3.10
          resources:
            requests: {cpu: 5m, memory: 8Mi}
            limits: {cpu: 50m, memory: 32Mi}
