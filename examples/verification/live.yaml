# User-owned configuration. Every case is disabled until its target and observer are configured.
{
  "manifest": {
    "monitors": [
      {
        "id": "pulse-http",
        "name": "pulse-http",
        "enabled": true,
        "pulse_check": {
          "type": "http",
          "interval": "60s",
          "timeout": "5s",
          "config": {
            "url": "http://127.0.0.1:18080/health"
          }
        }
      },
      {
        "id": "pulse-tcp",
        "name": "pulse-tcp",
        "enabled": true,
        "pulse_check": {
          "type": "tcp",
          "interval": "60s",
          "timeout": "5s",
          "config": {
            "host": "127.0.0.1",
            "port": 18081
          }
        }
      },
      {
        "id": "pulse-icmp",
        "name": "pulse-icmp",
        "enabled": true,
        "pulse_check": {
          "type": "icmp",
          "interval": "60s",
          "timeout": "5s",
          "config": {
            "host": "127.0.0.1",
            "count": 1
          }
        }
      },
      {
        "id": "pulse-dns",
        "name": "pulse-dns",
        "enabled": true,
        "pulse_check": {
          "type": "dns",
          "interval": "60s",
          "timeout": "5s",
          "config": {
            "host": "cpra.test",
            "server": "127.0.0.1:15353"
          }
        }
      },
      {
        "id": "pulse-udp",
        "name": "pulse-udp",
        "enabled": true,
        "pulse_check": {
          "type": "udp",
          "interval": "60s",
          "timeout": "5s",
          "config": {
            "host": "127.0.0.1",
            "port": 18082,
            "payload": "cpra-verification"
          }
        }
      },
      {
        "id": "pulse-grpc",
        "name": "pulse-grpc",
        "enabled": true,
        "pulse_check": {
          "type": "grpc",
          "interval": "60s",
          "timeout": "5s",
          "config": {
            "host": "127.0.0.1",
            "port": 18083
          }
        }
      },
      {
        "id": "pulse-docker",
        "name": "pulse-docker",
        "enabled": true,
        "pulse_check": {
          "type": "docker",
          "interval": "60s",
          "timeout": "5s",
          "config": {
            "container": "cpra-verification"
          }
        }
      },
      {
        "id": "pulse-tls",
        "name": "pulse-tls",
        "enabled": true,
        "pulse_check": {
          "type": "tls",
          "interval": "60s",
          "timeout": "5s",
          "config": {
            "host": "127.0.0.1",
            "port": 18443,
            "server_name": "localhost",
            "insecure_skip_verify": true,
            "critical_days": 1
          }
        }
      },
      {
        "id": "pulse-redis",
        "name": "pulse-redis",
        "enabled": true,
        "pulse_check": {
          "type": "redis",
          "interval": "60s",
          "timeout": "5s",
          "config": {
            "addr": "127.0.0.1:16379",
            "password": "REPLACE_WITH_CONFIGURED_PASSWORD",
            "db": 0
          }
        }
      },
      {
        "id": "pulse-postgres",
        "name": "pulse-postgres",
        "enabled": true,
        "pulse_check": {
          "type": "postgres",
          "interval": "60s",
          "timeout": "5s",
          "config": {
            "host": "127.0.0.1",
            "port": 15432,
            "user": "cpra",
            "password": "REPLACE_WITH_CONFIGURED_PASSWORD",
            "database": "cpra",
            "sslmode": "disable"
          }
        }
      },
      {
        "id": "pulse-mysql",
        "name": "pulse-mysql",
        "enabled": true,
        "pulse_check": {
          "type": "mysql",
          "interval": "60s",
          "timeout": "5s",
          "config": {
            "host": "127.0.0.1",
            "port": 13306,
            "user": "cpra",
            "password": "REPLACE_WITH_CONFIGURED_PASSWORD",
            "database": "cpra"
          }
        }
      },
      {
        "id": "pulse-mongo",
        "name": "pulse-mongo",
        "enabled": true,
        "pulse_check": {
          "type": "mongo",
          "interval": "60s",
          "timeout": "5s",
          "config": {
            "uri": "mongodb://127.0.0.1:17017/?directConnection=true"
          }
        }
      },
      {
        "id": "pulse-rabbitmq",
        "name": "pulse-rabbitmq",
        "enabled": true,
        "pulse_check": {
          "type": "rabbitmq",
          "interval": "60s",
          "timeout": "5s",
          "config": {
            "url": "amqp://cpra:REPLACE_WITH_CONFIGURED_PASSWORD@127.0.0.1:15672/"
          }
        }
      },
      {
        "id": "pulse-kafka",
        "name": "pulse-kafka",
        "enabled": true,
        "pulse_check": {
          "type": "kafka",
          "interval": "60s",
          "timeout": "5s",
          "config": {
            "brokers": [
              "127.0.0.1:19092"
            ]
          }
        }
      },
      {
        "id": "intervention-docker",
        "name": "intervention-docker",
        "enabled": true,
        "pulse_check": {
          "type": "http",
          "interval": "60s",
          "timeout": "5s",
          "config": {
            "url": "http://127.0.0.1:18080/health"
          }
        },
        "intervention": {
          "action": "docker",
          "target": {
            "type": "docker",
            "container": "cpra-verification"
          },
          "max_failures": 1
        }
      },
      {
        "id": "intervention-webhook",
        "name": "intervention-webhook",
        "enabled": true,
        "pulse_check": {
          "type": "http",
          "interval": "60s",
          "timeout": "5s",
          "config": {
            "url": "http://127.0.0.1:18080/health"
          }
        },
        "intervention": {
          "action": "webhook",
          "target": {
            "type": "webhook",
            "url": "http://127.0.0.1:18080/recover",
            "method": "POST",
            "timeout": "10s"
          },
          "max_failures": 1
        }
      },
      {
        "id": "intervention-kubernetes",
        "name": "intervention-kubernetes",
        "enabled": true,
        "pulse_check": {
          "type": "http",
          "interval": "60s",
          "timeout": "5s",
          "config": {
            "url": "http://127.0.0.1:18080/health"
          }
        },
        "intervention": {
          "action": "kubernetes",
          "target": {
            "type": "kubernetes",
            "kubeconfig_path": "/path/to/designated-kubeconfig",
            "namespace": "cpra-verification",
            "kind": "deployment",
            "name": "fixture",
            "timeout": "30s"
          },
          "max_failures": 1
        }
      },
      {
        "id": "intervention-aws",
        "name": "intervention-aws",
        "enabled": true,
        "pulse_check": {
          "type": "http",
          "interval": "60s",
          "timeout": "5s",
          "config": {
            "url": "http://127.0.0.1:18080/health"
          }
        },
        "intervention": {
          "action": "aws",
          "target": {
            "type": "aws",
            "region": "REPLACE_WITH_REGION",
            "operation": "reboot-instance",
            "instance_id": "REPLACE_WITH_DESIGNATED_INSTANCE",
            "timeout": "30s"
          },
          "max_failures": 1
        }
      },
      {
        "id": "intervention-systemd",
        "name": "intervention-systemd",
        "enabled": true,
        "pulse_check": {
          "type": "http",
          "interval": "60s",
          "timeout": "5s",
          "config": {
            "url": "http://127.0.0.1:18080/health"
          }
        },
        "intervention": {
          "action": "systemd",
          "target": {
            "type": "systemd",
            "unit": "cpra-verification.service",
            "mode": "replace",
            "timeout": "30s"
          },
          "max_failures": 1
        }
      },
      {
        "id": "code-log",
        "name": "code-log",
        "enabled": true,
        "pulse_check": {
          "type": "http",
          "interval": "60s",
          "timeout": "5s",
          "config": {
            "url": "http://127.0.0.1:18080/health"
          }
        },
        "codes": {
          "red": {
            "dispatch": true,
            "notify": "log",
            "config": {
              "file": "/tmp/cpra-verification-alerts.jsonl"
            }
          }
        }
      },
