monitors:
  - name: test-http-monitor
    enabled: true
    pulse_check:
      type: http
      interval: 30s
      timeout: 5s
      max_failures: 3
      config:
        url: http://localhost:8080/health
        method: GET
        retries: 2
    codes:
      red:
        notify: log
        config:
          file: ""

  - name: test-tcp-monitor
    enabled: true
    pulse_check:
      type: tcp
      interval: 10s
      timeout: 2s
      config:
        host: localhost
        port: 5432
        retries: 1
    codes:
      red:
        notify: log
        config:
          file: ""
